name: Calculator Three-Tier CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKER_BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/calculator-backend:latest

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies & Lint/Test
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Basic syntax check for Python backend
          python -m py_compile backend/app.py

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_BACKEND_IMAGE }}

      - name: Test Stack Deployment Locally (Optional Smoke Test)
        run: |
          docker compose up -d --build
          sleep 10
          docker compose ps
          docker compose down
