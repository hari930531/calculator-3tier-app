name: Calculator Three-Tier Pure Docker Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKER_FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/calculator-frontend:latest
  DOCKER_BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/calculator-backend:latest
  DOCKER_DATABASE_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/calculator-database:latest

jobs:
  # ============================================================================
  # JOB 1: BUILD AND PUSH CONTAINER IMAGES (CI)
  # ============================================================================
  build-and-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Database Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./database/Dockerfile
          push: true
          tags: ${{ env.DOCKER_DATABASE_IMAGE }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_BACKEND_IMAGE }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_FRONTEND_IMAGE }}

  # ============================================================================
  # JOB 2: DEPLOY CONTAINERS ON AMAZON EC2 (CD)
  # ============================================================================
  deploy:
    name: Deploy to Amazon EC2 via SSH
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy Pure Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=== Step 1: Log in to Docker Hub on EC2 ==="
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

            echo "=== Step 2: Ensure Dedicated Bridge Network Exists ==="
            docker network inspect Calci-Network >/dev/null 2>&1 || docker network create Calci-Network

            echo "=== Step 3: Pull Latest Images from Docker Hub ==="
            docker pull ${{ env.DOCKER_DATABASE_IMAGE }}
            docker pull ${{ env.DOCKER_BACKEND_IMAGE }}
            docker pull ${{ env.DOCKER_FRONTEND_IMAGE }}

            echo "=== Step 4: Stop and Remove Existing Containers ==="
            docker stop mysql-db calc-backend calc-frontend || true
            docker rm mysql-db calc-backend calc-frontend || true

            echo "=== Step 5: Start MySQL Database Container ==="
            # Runs detached, connected to Calci-Network with persistent named volume mysql-data
            docker run -d \
              --name mysql-db \
              --network Calci-Network \
              --restart always \
              -e MYSQL_ROOT_PASSWORD=rootpassword \
              -e MYSQL_DATABASE=calculator_db \
              -v mysql-data:/var/lib/mysql \
              -p 3306:3306 \
              ${{ env.DOCKER_DATABASE_IMAGE }}

            echo "=== Step 6: Wait for MySQL to Accept Connections ==="
            # Polls until the MySQL engine responds to ping queries
            until docker exec mysql-db mysqladmin ping -h localhost -u root -prootpassword --silent; do
              echo "Waiting for MySQL database to become healthy..."
              sleep 3
            done

            echo "=== Step 7: Start Backend Service Container ==="
            # Connects to Calci-Network and resolves mysql-db container name directly via Docker DNS
            docker run -d \
              --name calc-backend \
              --network Calci-Network \
              --restart always \
              -e DB_HOST=mysql-db \
              -e DB_USER=root \
              -e DB_PASSWORD=rootpassword \
              -e DB_NAME=calculator_db \
              -p 5000:5000 \
              ${{ env.DOCKER_BACKEND_IMAGE }}

            echo "=== Step 8: Start Frontend Web Container ==="
            docker run -d \
              --name calc-frontend \
              --network Calci-Network \
              --restart always \
              -p 80:80 \
              ${{ env.DOCKER_FRONTEND_IMAGE }}

            echo "=== Step 9: Cleanup Unused Images ==="
            docker image prune -af

            echo "=== Step 10: Verify Running Containers ==="
            docker ps --filter "network=Calci-Network"